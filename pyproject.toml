[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sigpatch"
version = "0.1.0"
description = "Signature-anchored binary patching that refuses to guess."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Apache-2.0" }
authors = [{ name = "JasonMetal" }]
keywords = ["binary-patching", "pe", "reverse-engineering", "fail-closed"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Software Development :: Disassemblers",
]

[project.scripts]
sigpatch = "sigpatch.cli:main"

[tool.setuptools]
packages = ["sigpatch"]
